<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Paint in the stored theme before first render, so there is no flash.
			try {
				var t = localStorage.getItem('sigurado.theme');
				var all = ['light', 'paper', 'dark', 'tech', 'contrast'];
				if (all.indexOf(t) === -1) {
					t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				var dark = t === 'dark' || t === 'tech' || t === 'contrast';
				var r = document.documentElement;
				if (dark) r.classList.add('dark');
				if (t !== 'light' && t !== 'dark') r.classList.add(t);
				r.style.colorScheme = dark ? 'dark' : 'light';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
